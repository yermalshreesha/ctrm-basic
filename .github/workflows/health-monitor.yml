name: Health monitor

# Checks production's /api/health every 6 hours, and can also be
# started by hand from the Actions tab (with an option to simulate a
# failure, for demos). It retries for a few minutes before deciding,
# since the free tier takes time to wake up from sleep. If production is
# still unhealthy, it files or updates one "incident" issue -- it never
# restarts, redeploys, or rolls back anything itself. See
# intent/changes/010-health-monitor.md and intent/plan.md Phase 24.
on:
  schedule:
    # Every 6 hours, 5 minutes past the hour -- avoids GitHub's
    # top-of-hour scheduling crunch (same reasoning as security-scan.yml's
    # daily cron). Every 30 minutes was the original design, but each
    # check itself wakes a sleeping free-tier service back up -- checking
    # that often kept production awake almost continuously, burning
    # Render's free-tier instance hours. 6 hours was chosen to let the
    # service actually sleep between checks; see intent/plan.md Phase 24
    # for the trade-off this accepts (an outage can go undetected for up
    # to ~6 hours instead of ~30 minutes).
    - cron: "5 */6 * * *"
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Simulate a failure (checks a non-existent path instead of /api/health) -- for demos, never touches real production health"
        type: boolean
        default: false

# Deliberately does NOT use the `production` Environment (deploy-
# production.yml) -- that gate requires a person to approve every run,
# which would defeat an unattended scheduled check. The address to
# check comes from a plain repository variable, MONITOR_URL, not an
# Environment secret/variable.
permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Retries for up to 3 minutes (free-tier wake-up time) before
      # deciding production is actually unhealthy. Writes its result to
      # $GITHUB_OUTPUT so the next step only runs when still unhealthy.
      - name: Check health (retrying for up to 3 minutes)
        id: health
        env:
          MONITOR_URL: ${{ vars.MONITOR_URL }}
          SIMULATE_FAILURE: ${{ inputs.simulate_failure }}
        run: |
          MONITOR_URL=$(printf '%s' "$MONITOR_URL" | tr -d '[:space:]')

          if [ "$SIMULATE_FAILURE" = "true" ]; then
            CHECK_URL="$MONITOR_URL/api/this-path-does-not-exist"
          else
            CHECK_URL="$MONITOR_URL/api/health"
          fi
          echo "Checking $CHECK_URL"

          deadline=$((SECONDS + 180))
          status="000"
          body=""
          response_ms="n/a"
          while [ "$SECONDS" -lt "$deadline" ]; do
            start_ms=$(date +%s%3N)
            status=$(curl -s --max-time 10 -o /tmp/health-body.txt -w "%{http_code}" "$CHECK_URL")
            status="${status:-000}"
            end_ms=$(date +%s%3N)
            response_ms="$((end_ms - start_ms))ms"
            body=$(cat /tmp/health-body.txt 2>/dev/null || echo "")

            if [ "$status" = "200" ]; then
              echo "Healthy (status $status, $response_ms)."
              echo "healthy=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Not healthy yet (status $status), retrying in 15s..."
            sleep 15
          done

          echo "Still unhealthy after 3 minutes of retries (last status $status)."
          echo "healthy=false" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "response_ms=$response_ms" >> "$GITHUB_OUTPUT"
          echo "checked_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_OUTPUT"
          {
            echo "body<<HEALTH_BODY_EOF"
            echo "$body"
            echo "HEALTH_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Report incident as a GitHub issue
        if: steps.health.outputs.healthy != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MONITOR_URL: ${{ vars.MONITOR_URL }}
          SIMULATE_FAILURE: ${{ inputs.simulate_failure }}
          HEALTH_STATUS: ${{ steps.health.outputs.status }}
          HEALTH_RESPONSE_MS: ${{ steps.health.outputs.response_ms }}
          HEALTH_BODY: ${{ steps.health.outputs.body }}
          HEALTH_CHECKED_AT: ${{ steps.health.outputs.checked_at }}
        run: node scripts/health-monitor-report.mjs
